name: Build and Push Pod Docker Image

on:
  push:
    branches:
      - main
      - v2
    paths:
      - 'pod/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:
    inputs:
      update_template:
        description: Update the shared RunPod template after building
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: may4vfx/rpfarm-pod

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: meta
        run: |
          image_tags="$REGISTRY/$IMAGE_NAME:${GITHUB_SHA::7}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            image_tags="$image_tags,$REGISTRY/$IMAGE_NAME:latest"
          fi
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image_tags=$image_tags" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: pod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update RunPod template
        if: github.event_name != 'workflow_dispatch' || inputs.update_template
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          TEMPLATE_ID: ${{ vars.RPFARM_TEMPLATE_ID }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}
        run: |
          curl -sf -X PATCH "https://rest.runpod.io/v1/templates/$TEMPLATE_ID" \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"imageName\":\"$IMAGE\"}"
